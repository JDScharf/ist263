<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IST 305 Student Matching</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1e2d;
        --panel: #122a3c;
        --panel-2: #16334a;
        --gold: #c9a24b;
        --gold-dim: rgba(201, 162, 75, 0.35);
        --teal: #5fc3b8;
        --text: #ece5d3;
        --text-muted: #8ea3af;
        --border: rgba(201, 162, 75, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", sans-serif;
        background-image: repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 79px,
            rgba(201, 162, 75, 0.055) 80px
          ),
          repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 79px,
            rgba(201, 162, 75, 0.055) 80px
          ),
          radial-gradient(
            circle at 82% -6%,
            rgba(95, 195, 184, 0.16),
            transparent 42%
          );
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 24px 80px;
      }

      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--teal);
        text-align: center;
        margin: 0 0 14px;
      }

      h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: clamp(30px, 4.5vw, 44px);
        text-align: center;
        margin: 0 0 10px;
        letter-spacing: -0.01em;
      }

      .subtitle {
        text-align: center;
        color: var(--text-muted);
        font-size: 15px;
        max-width: 480px;
        margin: 0 auto 40px;
        line-height: 1.55;
        font-style: italic;
        font-family: "Fraunces", serif;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 22px 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 22px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .field input {
        width: 90px;
        padding: 9px 10px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 15px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--text);
      }

      .field input:focus {
        outline: none;
        border-color: var(--teal);
      }

      button {
        padding: 11px 22px;
        margin-top: 18px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: var(--gold);
        color: #17263a;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        background: #d9b665;
      }

      .stat-line {
        text-align: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin-bottom: 26px;
        min-height: 16px;
      }

      .stat-line strong {
        color: var(--teal);
        font-weight: 600;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 4px;
        overflow: hidden;
      }

      thead th {
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--bg);
        background: var(--gold);
        text-align: left;
        padding: 12px 18px;
      }

      thead th:first-child {
        padding-left: 46px;
      }

      tbody {
        position: relative;
      }

      tbody::before {
        content: "";
        position: absolute;
        left: 23px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(var(--gold-dim), var(--gold-dim) 100%);
      }

      tbody tr td {
        padding: 13px 18px;
        border-top: 1px solid var(--border);
        font-size: 14.5px;
      }

      tbody tr:nth-child(odd) {
        background: var(--panel-2);
      }

      tbody td:first-child {
        position: relative;
        padding-left: 46px;
        font-family: "IBM Plex Mono", monospace;
        color: var(--teal);
        font-weight: 500;
        white-space: nowrap;
      }

      tbody td:first-child::before {
        content: "";
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--teal);
        box-shadow: 0 0 0 4px rgba(95, 195, 184, 0.22);
      }

      tbody td:last-child {
        color: var(--text);
      }

      @media (prefers-reduced-motion: no-preference) {
        tbody tr {
          animation: rise 0.32s ease backwards;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 520px) {
        .panel {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">IST 305 · Globalism, IT &amp; Culture</p>
      <h1>Student groups assignment</h1>

      <div class="panel">
        <div class="field">
          <label for="groupSize">Students per group</label>
          <input
            type="number"
            id="groupSize"
            name="groupSize"
            value="2"
            min="1"
          />
        </div>
        <button onclick="generateGroups()">Sort groups</button>
      </div>

      <p class="stat-line" id="statLine"></p>

      <table id="pairsTable">
        <thead>
          <tr>
            <th>Node</th>
            <th>Members</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      const students = [
        "Daniel",
        "Brooke",
        "Macey",
        "Idrissa",
        "Stella",
        "Amanda",
        "Ricky",
        "SY",
        "Sarah",
        "Grace",
        "Aaliyah",
        "Harold",
        "Brayden",
        "Moustapha",
        "Zuri",
        "Chloe",
        "Sonali",
        "Bogue",
        "Genesis J.",
        "Caitlyn",
        "Olivia",
        "Alex",
        "Jonathan",
        "Teresa",
        "Rowan",
        "Chau",
        "Genesis N.",
        "Jaylene",
        "Alex",
        "Laurengia",
        "Anna",
        "Aryaman",
        "Then",
        "Sloan",
        "Kyle",
        "Alex",
        "Marisa",
        "Grant",
        "Charlie",
        "Tyler",
      ];

      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function generateGroups() {
        const groupSizeInput = document.getElementById("groupSize");
        let groupSize = parseInt(groupSizeInput.value, 10);

        if (isNaN(groupSize) || groupSize < 1) {
          alert(
            "Please enter a valid number greater than 0 for the group size.",
          );
          return;
        }

        const shuffledStudents = [...students];
        shuffleArray(shuffledStudents);

        const totalStudents = shuffledStudents.length;
        const numGroups = Math.max(1, Math.round(totalStudents / groupSize));

        const groups = Array.from({ length: numGroups }, () => []);

        shuffledStudents.forEach((student, i) => {
          groups[i % numGroups].push(student);
        });

        document.getElementById(
          "statLine",
        ).innerHTML = `<strong>${totalStudents}</strong> students routed into <strong>${numGroups}</strong> groups`;

        displayGroups(groups);
      }

      function displayGroups(groups) {
        const tableBody = document.querySelector("#pairsTable tbody");
        tableBody.innerHTML = "";

        groups.forEach((group, index) => {
          const row = document.createElement("tr");
          row.style.animationDelay = `${index * 0.04}s`;

          const groupCell = document.createElement("td");
          groupCell.textContent = `Group ${String(index + 1).padStart(2, "0")}`;
          row.appendChild(groupCell);

          const studentsCell = document.createElement("td");
          studentsCell.textContent = group.join(", ");
          row.appendChild(studentsCell);

          tableBody.appendChild(row);
        });
      }
    </script>
  </body>
</html>
